dataset:
  name: uci_har
  raw_dir: data/raw/uci_har
  channels:
    - total_acc_x
    - total_acc_y
    - total_acc_z
    - body_gyro_x
    - body_gyro_y
    - body_gyro_z

window:
  size: 128

split:
  method: official_train_test
  val_ratio: 0.15
  seed: 20260521

model:
  type: medium_conv1d
  batch_size: 64
  epochs: 30
  learning_rate: 0.001
  dropout: 0.3
  verbose: 2

callbacks:
  early_stopping:
    enabled: true
    monitor: val_accuracy
    mode: max
    patience: 5
    min_delta: 0.0
  checkpoint:
    enabled: true
    monitor: val_accuracy
    mode: max

output:
  dir: outputs/v5/uci_har_medium_conv1d

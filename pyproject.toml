[project]
name = "real-time-detection-user-defined-actions"
version = "0.1.0"
description = "Personalized on-device activity recognition from wearable-like motion signals"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "tensorflow>=2.21.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
qualcomm = [
    "python-dotenv>=1.2.2",
    "qai-hub>=0.49.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.0.3",
]

[tool.black]
target-version = ["py311"]
